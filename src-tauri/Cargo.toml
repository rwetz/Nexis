[package]
name = "nexis"
version = "1.26.0"
description = "Nexis — an AI-native terminal emulator"
authors = []
edition = "2021"
# Desktop application binary — never published to crates.io. Marking it
# non-publishable also lets cargo-deny's `licenses.private.ignore` skip the
# license check on our own crate (it carries no SPDX license field).
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nexis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: serves local files (image viewer, ML sample grid) via
# asset://localhost — convertFileSrc() URLs 404 without it.
# devtools: keeps the inspector compiled into *release* builds. Debug
# builds enable it implicitly; without this flag a shipped Nexis has no
# console at all, which made the frontend half of every pitfall
# checklist ("check the devtools console for [nexis] openPty failed:")
# impossible to follow on the binary users actually run. On WebView2 the
# inspector UI ships with the Edge runtime, not with us, so the cost is
# a measured +9 KiB on nexis.exe (9904128 -> 9913344 bytes, release
# profile). Re-measure against the size gate if that ever changes.
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
dirs = "6"
log = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
globset = "0.4"
shared_child = "1"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = [
	"rustls-tls",
	"stream",
] }
bytes = "1"
futures-util = "0.3"
# Engine-install integrity: SHA-256 of downloaded/local nexis-ml binaries
# against the compiled-in pin (ml.rs ENGINE_PIN). Already in the tree
# transitively, so this adds no new code to the binary.
sha2 = "0.11"
# tokio is intentionally pulled with ONLY the `rt` feature (IDEAS C2). The async
# runtime is deliberately minimal: `net`/`io`/`time`/`full` drag in mio, a
# socket stack, and timer machinery that materially grow the binary against the
# <10 MB budget (enforced in release CI). Do NOT enable additional tokio
# features without a size review — this directly constrains any true-push
# networking work (e.g. a WebSocket server would want `net`/`io`).
tokio = { version = "1", default-features = false, features = ["rt"] }
tempfile = "3"
# Sampling backend for the system-resource analyzer (modules/sysmon.rs).
# Feature-minimal on purpose: the default set pulls `component` (thermal
# sensors), `user` (passwd/SAM lookups), and `multithread` (rayon) — none of
# which the panel reads, and rayon in particular is a large unit against the
# <10 MB release budget. Do NOT switch this to default features; re-measure
# the binary if you ever need to add one back.
sysinfo = { version = "0.39", default-features = false, features = [
	"system",
	"disk",
	"network",
] }
# Native filesystem watching for the explorer (modules/fswatch.rs), replacing
# a 3 s poll. default-features off drops `crossbeam-channel` (the std mpsc
# channel is enough for one debounce thread) and the serde support we never
# serialize through; `macos_fsevent` is the platform backend and is a no-op on
# other targets. Re-measure the Windows binary before adding a feature — the
# release budget is 10 MB and headroom is thin.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# ── Atlas panel (modules/atlas) ──────────────────────────────────────────────
# Repo scanning without shelling out to git. `default-features = false` drops
# the ssh/https transports: Atlas is read-only and never talks to a remote, so
# the network half of libgit2 is pure size. Note this is the one place Nexis
# links libgit2 -- the source-control panel drives the `git` CLI instead
# (modules/git), and that split is deliberate: the CLI respects the user's
# config, credential helpers and hooks, which is what a panel that *writes*
# needs, while a read-only whole-machine sweep wants in-process reads.
git2 = { version = "0.20", default-features = false }
# The scan fans out one worker per repo. Previously argued against for the
# sysinfo dep on size grounds; Atlas is the use that justifies it -- ten repos
# including a full filesystem walk land in ~270 ms because of this.
rayon = "1.10"
# `atlas.toml`, the hand-edited repo list.
toml = "0.8"

# ── Benchmark panel (modules/benchmark) ──────────────────────────────────────
# Result timestamps.
chrono = { version = "0.4", features = ["serde"] }
# Real ONNX inference. This is the largest single dependency in the tree by a
# wide margin: `download-binaries` (a default feature) fetches a prebuilt ONNX
# Runtime at build time, which is why the release size tripwire moved from
# 40 MB to 150 MB in the same change that added this. Bundling an inference
# engine reverses the position argued in docs/ML_SUITE.md; the reasoning for
# reversing it is in docs/vault/decisions/bundling-onnx-runtime.md. Pinned to
# the rc because 2.0 has not had a final release -- revisit on the first stable
# tag rather than tracking rcs.
#
# `default-features = false` drops exactly one thing from the default set:
# `copy-dylibs`. That feature copies whatever shared libraries the downloaded
# ORT ships next to the built binary -- on Windows that is DirectML.dll, for a
# GPU execution provider the Benchmark panel never requests (onnx.rs commits a
# session with no execution providers, i.e. the CPU one). Leaving it on put a
# DLL beside the exe that `tauri build` does not bundle, so a dev build and an
# installed build would have differed in what sat next to the binary -- and the
# fix for that would have been a Windows-only path in bundle.resources that
# breaks the Linux release job. CPU-only ORT static-links, so there is nothing
# to ship on any platform and the whole class of problem does not exist.
#
# This is also the shape the decision note claims: a fixed-size, CPU-by-default,
# prebuilt artifact with one build path and no GPU-driver support surface. If a
# GPU execution provider is ever wanted, it is a real piece of work -- the
# feature, the bundled dylibs, and per-platform bundle config -- not a flag.
ort = { version = "2.0.0-rc.12", default-features = false, features = [
	"std",
	"ndarray",
	"download-binaries",
	"tls-native",
	"api-27",
] }
# Native file pickers for model files, the llama-bench binary, and the export
# save target. All three are by definition outside the workspace, so the
# explorer cannot stand in for them.
tauri-plugin-dialog = "2"

[dev-dependencies]
# Benchmarks only — never compiled into shipping builds (dev-dependency +
# the bench target requires the non-default `bench-internals` feature).
criterion = "0.8"

[features]
# Exposes hot-path internals to benches/ (see lib.rs::bench_internals).
# Never enabled by default; do not enable in shipping builds.
bench-internals = []

[[bench]]
name = "hot_paths"
harness = false
required-features = ["bench-internals"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"apple-native",
] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"windows-native",
] }
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"

[profile.dev]
incremental = true

# Shipping profile — size-first (10 MB budget enforced in release CI).
# Do not relax fat LTO / strip here; use the non-shipping profiles below
# for perf iteration and profiling instead.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true

# perf/flamegraph against optimized code — keeps symbols, never ships.
# `cargo build --profile profiling`
[profile.profiling]
inherits = "release"
debug = "limited"
strip = false
lto = "thin"

# "is it fast enough?" iteration loop without the fat-LTO wait — never ships.
# `cargo build --profile release-fast`
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

[lints.clippy]
# Perf paper-cut catcher (nursery lint — warn, promoted to deny by CI's
# `clippy -- -D warnings`; #[allow] per-site if it false-positives).
redundant_clone = "warn"
# Hygiene: nothing half-finished reaches CI.
dbg_macro = "warn"
todo = "warn"
