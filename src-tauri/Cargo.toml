[package]
name = "nexis-imagine"
version = "0.1.0"
description = "Isometric visualization of local git repos — directories as terraces, files as buildings."
authors = ["Ryan Wetzstein"]
edition = "2021"

[lib]
name = "nexis_imagine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Read-only local scanning — no network transports needed, so default
# features (ssh/https) are disabled to keep the build lean.
git2 = { version = "0.20", default-features = false }
rayon = "1.10"
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
strip = true
