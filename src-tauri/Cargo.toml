[package]
name = "nexis"
version = "1.23.0"
description = "Nexis — an AI-native terminal emulator"
authors = []
edition = "2021"
# Desktop application binary — never published to crates.io. Marking it
# non-publishable also lets cargo-deny's `licenses.private.ignore` skip the
# license check on our own crate (it carries no SPDX license field).
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nexis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: serves local files (image viewer, ML sample grid) via
# asset://localhost — convertFileSrc() URLs 404 without it.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
dirs = "5"
log = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
globset = "0.4"
shared_child = "1"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = [
	"rustls-tls",
	"stream",
] }
bytes = "1"
futures-util = "0.3"
# Engine-install integrity: SHA-256 of downloaded/local nexis-ml binaries
# against the compiled-in pin (ml.rs ENGINE_PIN). Already in the tree
# transitively, so this adds no new code to the binary.
sha2 = "0.11"
# tokio is intentionally pulled with ONLY the `rt` feature (IDEAS C2). The async
# runtime is deliberately minimal: `net`/`io`/`time`/`full` drag in mio, a
# socket stack, and timer machinery that materially grow the binary against the
# <10 MB budget (enforced in release CI). Do NOT enable additional tokio
# features without a size review — this directly constrains any true-push
# networking work (e.g. a WebSocket server would want `net`/`io`).
tokio = { version = "1", default-features = false, features = ["rt"] }
tempfile = "3"
# Sampling backend for the system-resource analyzer (modules/sysmon.rs).
# Feature-minimal on purpose: the default set pulls `component` (thermal
# sensors), `user` (passwd/SAM lookups), and `multithread` (rayon) — none of
# which the panel reads, and rayon in particular is a large unit against the
# <10 MB release budget. Do NOT switch this to default features; re-measure
# the binary if you ever need to add one back.
sysinfo = { version = "0.39", default-features = false, features = [
	"system",
	"disk",
	"network",
] }
# Native filesystem watching for the explorer (modules/fswatch.rs), replacing
# a 3 s poll. default-features off drops `crossbeam-channel` (the std mpsc
# channel is enough for one debounce thread) and the serde support we never
# serialize through; `macos_fsevent` is the platform backend and is a no-op on
# other targets. Re-measure the Windows binary before adding a feature — the
# release budget is 10 MB and headroom is thin.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[dev-dependencies]
# Benchmarks only — never compiled into shipping builds (dev-dependency +
# the bench target requires the non-default `bench-internals` feature).
criterion = "0.5"

[features]
# Exposes hot-path internals to benches/ (see lib.rs::bench_internals).
# Never enabled by default; do not enable in shipping builds.
bench-internals = []

[[bench]]
name = "hot_paths"
harness = false
required-features = ["bench-internals"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"apple-native",
] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"windows-native",
] }
windows-sys = { version = "0.59", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"

[profile.dev]
incremental = true

# Shipping profile — size-first (10 MB budget enforced in release CI).
# Do not relax fat LTO / strip here; use the non-shipping profiles below
# for perf iteration and profiling instead.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true

# perf/flamegraph against optimized code — keeps symbols, never ships.
# `cargo build --profile profiling`
[profile.profiling]
inherits = "release"
debug = "limited"
strip = false
lto = "thin"

# "is it fast enough?" iteration loop without the fat-LTO wait — never ships.
# `cargo build --profile release-fast`
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

[lints.clippy]
# Perf paper-cut catcher (nursery lint — warn, promoted to deny by CI's
# `clippy -- -D warnings`; #[allow] per-site if it false-positives).
redundant_clone = "warn"
# Hygiene: nothing half-finished reaches CI.
dbg_macro = "warn"
todo = "warn"
