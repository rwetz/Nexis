# cargo-deny configuration — supply-chain depth gate (IDEAS B5).
#
# Run locally with `cargo deny check` from `src-tauri/`. CI runs the same in
# the weekly Security-audit workflow (`.github/workflows/audit.yml`), alongside
# `cargo audit`. cargo-deny adds three things `cargo audit` doesn't: a license
# allow-list, duplicate-dependency visibility, and a source registry lock.

[advisories]
# Fail hard on actual security *vulnerabilities* and yanked crates anywhere in
# the tree. For "unmaintained" advisories we mirror cargo-audit's posture: a
# crate going unmaintained is not itself a vulnerability, and ours come in only
# transitively through Tauri (the gtk-rs GTK3 bindings on Linux, the rust-unic
# Unicode tables, proc-macro-error) with no fix path until Tauri migrates. So
# only flag an unmaintained crate if *we* depend on it directly — that's a
# signal we can act on — and tolerate the transitive ones.
unmaintained = "workspace"
yanked = "deny"
# No advisory ignores: the quick-xml 0.39.4 DoS advisories (RUSTSEC-2026-0194/
# 0195) that used to live here are resolved for real — `plist` moved 1.9.0 →
# 1.10.0 (permitted by Tauri's `plist = "^1"`), pulling quick-xml 0.41.0.
# Prefer a real dependency bump over suppressing a vuln. The entries below can't
# be bumped from this repo: both arrive through the pinned nexis-epoch git
# dependency, so the fix lives there.
ignore = [
  # zip 6.0.0 (fixed >=9.0.0). Only a *build-dependency* of libduckdb-sys
  # (epoch-data > duckdb), used to unpack duckdb's own bundled source at compile
  # time. The extract bugs need an attacker-supplied archive; none reaches it.
  { id = "RUSTSEC-2026-0367", reason = "zip: build-dep of libduckdb-sys only, unpacks its own bundled archive" },
  { id = "RUSTSEC-2026-0368", reason = "zip: build-dep of libduckdb-sys only, unpacks its own bundled archive" },
  { id = "RUSTSEC-2026-0369", reason = "zip: build-dep of libduckdb-sys only, unpacks its own bundled archive" },
  { id = "RUSTSEC-2026-0429", reason = "zip: build-dep of libduckdb-sys only, unpacks its own bundled archive" },
  # libsqlite3-sys 0.38.2 (fixed >=0.39.0) via epoch-store > rusqlite 0.40.
  # TEMPORARY: bump rusqlite in nexis-epoch, bump the epoch rev here, delete this.
  { id = "RUSTSEC-2026-0459", reason = "via nexis-epoch rusqlite 0.40; remove once epoch bumps rusqlite" },
]

[licenses]
# Permissive + weak-copyleft licenses we accept. Anything not on this list
# fails the check, so a new dependency under a viral license (GPL/AGPL) can't
# slip in unnoticed.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "Unicode-3.0",
    # MPL-2.0 is file-level copyleft (cssparser/selectors family) — using the
    # crates unmodified imposes no obligation on our own source. Acceptable.
    "MPL-2.0",
    # LGPL-2.1-or-later reaches us only via `r-efi`, a UEFI-target runtime crate
    # pulled by getrandom. It is never compiled into the desktop binaries we
    # ship (macOS/Windows/Linux), so no dynamic-linking obligation applies.
    "LGPL-2.1-or-later",
]
# `nexis` itself carries no license field; skip workspace/own crates.
private = { ignore = true }
confidence-threshold = 0.8

[bans]
# Tauri's tree legitimately carries many duplicate versions (windows-sys, syn,
# toml, …). Surface them as a warning for periodic cleanup, but don't fail CI —
# a hard "deny" here would be permanently red through no fault of our own code.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Every dependency must come from a known registry. Blocks a typosquatted or
# unexpected git/registry source from being introduced.
unknown-registry = "deny"
unknown-git = "deny"
# Nexis Epoch's backend (tauri-plugin-epoch and the epoch-* crates), pinned
# by rev in Cargo.toml. Same author; the Epoch window runs it.
allow-git = ["https://github.com/rwetz/nexis-epoch"]
