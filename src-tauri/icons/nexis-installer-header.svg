<!-- NSIS MUI header image (150x57). Source of truth for installer-logo.png;
     regenerate with: rsvg-convert -w 150 -h 57 nexis-installer-header.svg -o installer-logo.png -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 57" width="150" height="57">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#221645"/>
      <stop offset="0.55" stop-color="#120E26"/>
      <stop offset="1" stop-color="#08060F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#5227FF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#5227FF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#5227FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#D8CBFF"/>
      <stop offset="0.45" stop-color="#8B6BFF"/>
      <stop offset="1" stop-color="#3FD2E8"/>
    </linearGradient>
  </defs>

  <rect width="150" height="57" fill="url(#plate)"/>
  <rect width="150" height="57" fill="url(#glow)"/>

  <!-- the same caret/cursor lockup as the app icon, plate removed -->
  <g transform="translate(75 28.5) scale(0.0405) translate(-537 -512)">
    <path d="M 300 300 L 540 512 L 300 724"
          fill="none" stroke="url(#stroke)" stroke-width="104"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="606" y="672" width="220" height="104" rx="52" ry="52"
          fill="#F4F1FF" opacity="0.96"/>
  </g>
</svg>
