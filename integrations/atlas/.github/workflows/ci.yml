name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      # Also runs the postinstall that copies @nexis/design's cursor set into
      # public/. Those PNGs are not committed — a CSS `cursor: url()` resolves
      # against the document and cannot reach into node_modules — so a build
      # without this step ships without cursors.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

  rust:
    # Both platforms, because a good deal of this backend is behind `cfg`:
    # the Nexis discovery paths, the terminal spawn, and the NVIDIA/WebKitGTK
    # workaround are each compiled on one OS and invisible to the other. A
    # Linux-only job would let a Windows-only break through untouched.
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # Formatting is platform-independent; checking it twice would just
      # produce the same answer on a second machine.
      - name: cargo fmt
        if: startsWith(matrix.os, 'ubuntu')
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The scan and detail tests build real git repositories in a temp dir and
      # read them back with libgit2 — faking the fixture would test nothing,
      # since libgit2 reading a real repo is the thing under test. `git` is
      # preinstalled on both runners, and the helper in `testutil.rs` passes its
      # own committer identity, so no global git config is needed here.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
