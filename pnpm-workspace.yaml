# Supply-chain hardening. A compromised release is typically caught and
# unpublished within hours, so refusing to resolve anything published in the
# last 24 h means the common attack window closes before we would ever install
# it. Raise this if you want a wider margin; lower it only if a genuinely
# urgent security patch is being blocked (and prefer pinning that one version).
minimumReleaseAge: 1440
# `trustPolicy: no-downgrade` is deliberately NOT set. Enabling it fails
# `pnpm install` outright on the current lockfile: six transitive entries
# (@wdio/logger, @wdio/repl, chokidar@4.0.3, semver@6.3.1, undici-types@6.21.0,
# vite@5.4.21) are reported as high-risk trust downgrades because they predate
# npm provenance attestations, not because anything was taken over. Turning it
# on therefore means regenerating the lockfile and accepting whatever versions
# fall out — a dependency change, not a config change. Revisit when those
# transitives have moved to provenance-attested releases.

allowBuilds:
  edgedriver: false
  esbuild: true
  geckodriver: false
  msw: true
overrides:
  # Force mermaid past the moderate advisories (HTML/CSS injection, Gantt DoS)
  # fixed in >=11.14.1. Pulled in via streamdown>mermaid; streamdown@2.5.0 already
  # allows ^11.12.2, so this just lifts the resolved floor. Resolves to 11.15.0
  # (no 11.14.1 exists on npm).
  mermaid: '>=11.14.1'
  # mermaid's uuid range (^11.1.0 || ^12 || ^13 || ^14.0.0) otherwise resolves to
  # the vulnerable uuid@11.1.0 (GHSA-w5hq-g745-h8pq, patched >=11.1.1). Lift the
  # floor; resolves to uuid@14.0.0, which mermaid explicitly accepts (^14.0.0).
  uuid: '>=11.1.1'
