# Test nginx config — Nexis editor playground
# Exercises: http/server/location blocks, upstream, proxy, SSL, rate limiting,
#            maps, geo, rewrites, lua-style comments, include

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

# ── Events ────────────────────────────────────────────────────────────────────

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

# ── HTTP ──────────────────────────────────────────────────────────────────────

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log format
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time';

    log_format json escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time}';

    access_log  /var/log/nginx/access.log  main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml text/javascript
                    application/json application/javascript application/xml+rss
                    application/atom+xml image/svg+xml;

    # Buffer sizes
    client_body_buffer_size     128k;
    client_header_buffer_size   1k;
    client_max_body_size        100m;
    large_client_header_buffers 4 4k;

    # Timeouts
    client_body_timeout   12;
    client_header_timeout 12;
    send_timeout          10;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    server_tokens off;

    # ── Rate limiting ──────────────────────────────────────────────────────────

    limit_req_zone  $binary_remote_addr  zone=api:10m    rate=30r/m;
    limit_req_zone  $binary_remote_addr  zone=login:10m  rate=5r/m;
    limit_conn_zone $binary_remote_addr  zone=addr:10m;

    # ── Map variables ──────────────────────────────────────────────────────────

    map $request_method $allow_method {
        default  0;
        GET      1;
        HEAD     1;
        POST     1;
        PUT      1;
        PATCH    1;
        DELETE   1;
        OPTIONS  1;
    }

    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ""       close;
    }

    map $sent_http_content_type $expires {
        default                   off;
        ~image/                   max;
        ~video/                   1y;
        ~font/                    1y;
        text/css                  1y;
        application/javascript    1y;
        application/json          epoch;
    }

    # ── Geo-based routing ──────────────────────────────────────────────────────

    geo $limited_country {
        default        0;
        192.168.0.0/16 1;   # internal — bypass limits
        10.0.0.0/8     1;
    }

    # ── Upstreams ─────────────────────────────────────────────────────────────

    upstream nexis_api {
        least_conn;
        keepalive 32;

        server 10.0.1.10:8080 weight=3 max_fails=3 fail_timeout=30s;
        server 10.0.1.11:8080 weight=3 max_fails=3 fail_timeout=30s;
        server 10.0.1.12:8080 weight=1 max_fails=3 fail_timeout=30s backup;

        keepalive_requests 1000;
        keepalive_timeout  60s;
    }

    upstream nexis_ws {
        ip_hash;
        server 10.0.2.10:9090;
        server 10.0.2.11:9090;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────

    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS server ─────────────────────────────────────────────────────

    server {
        listen      443 ssl http2;
        listen      [::]:443 ssl http2;
        server_name nexis.dev www.nexis.dev;

        root /var/www/nexis/dist;
        index index.html;

        # SSL
        ssl_certificate     /etc/letsencrypt/live/nexis.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nexis.dev/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # Connection limits
        limit_conn addr 100;

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            expires $expires;
        }

        # Static assets — aggressive caching, no trailing slash rewrite
        location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif|mp4|webm)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── API proxy ──────────────────────────────────────────────────────────

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            limit_req_status 429;

            proxy_pass         http://nexis_api/;
            proxy_http_version 1.1;
            proxy_set_header   Connection     "";
            proxy_set_header   Host           $host;
            proxy_set_header   X-Real-IP      $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID   $request_id;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
            proxy_buffering       on;
            proxy_buffer_size     8k;
            proxy_buffers         16 8k;

            proxy_cache_bypass $http_pragma $http_authorization;
            proxy_no_cache     $http_pragma $http_authorization;

            # Retry on errors
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # Auth endpoint — stricter rate limit
        location /api/auth/ {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://nexis_api/auth/;
            include    /etc/nginx/proxy_params;
        }

        # ── WebSocket ─────────────────────────────────────────────────────────

        location /ws/ {
            proxy_pass          http://nexis_ws/;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection $connection_upgrade;
            proxy_set_header    Host       $host;
            proxy_read_timeout  3600s;  # keep WS connections alive
            proxy_send_timeout  3600s;
        }

        # ── Health check (no logs, no auth) ───────────────────────────────────

        location = /healthz {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ── Metrics (internal only) ───────────────────────────────────────────

        location = /metrics {
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny  all;
            proxy_pass http://nexis_api/metrics;
        }

        # Block common scanners / bad bots
        location ~* \.(php|asp|aspx|jsp|cgi)$ { return 444; }
        location ~* /\.(git|svn|env|htaccess) { return 444; }
    }

    # ── Wildcard subdomain → tenant routing ───────────────────────────────────

    server {
        listen      443 ssl http2;
        server_name ~^(?P<tenant>[a-z0-9-]+)\.nexis\.dev$;

        ssl_certificate     /etc/letsencrypt/live/nexis.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nexis.dev/privkey.pem;

        location / {
            proxy_pass         http://nexis_api;
            proxy_set_header   X-Tenant $tenant;
            include            /etc/nginx/proxy_params;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
