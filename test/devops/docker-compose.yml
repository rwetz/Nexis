name: nexis

# Test docker-compose.yml — Nexis editor playground
# Exercises: services, volumes, networks, healthchecks, profiles, extends,
#            build args, secrets, deploy (Swarm), anchors & aliases

# ── Reusable snippets ─────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-env-common: &env-common
  TZ: UTC
  LOG_LEVEL: "${LOG_LEVEL:-info}"

x-restart: &restart-policy
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
    window: 120s

# ── Services ──────────────────────────────────────────────────────────────────

services:

  # ── Frontend/app ────────────────────────────────────────────────────────────

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_VERSION: "${APP_VERSION:-1.3.0}"
        BUILD_DATE: "${BUILD_DATE:-}"
        GIT_COMMIT: "${GIT_COMMIT:-}"
      cache_from:
        - type=registry,ref=ghcr.io/rwetz00/nexis:cache
    image: ghcr.io/rwetz00/nexis:${APP_VERSION:-latest}
    container_name: nexis-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      <<: *env-common
      APP_ENV: production
      DATABASE_URL: postgresql://nexis:${DB_PASSWORD:-secret}@db:5432/nexis
      REDIS_URL: redis://redis:6379
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    env_file:
      - path: .env
        required: false
    secrets:
      - jwt_secret
      - db_password
    volumes:
      - app-data:/data
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging
    deploy:
      <<: *restart-policy
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
    labels:
      traefik.enable: "true"
      traefik.http.routers.nexis.rule: "Host(`nexis.dev`)"
      traefik.http.routers.nexis.tls.certresolver: "letsencrypt"

  # ── Database ─────────────────────────────────────────────────────────────────

  db:
    image: postgres:16-alpine
    container_name: nexis-db
    environment:
      POSTGRES_USER: nexis
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
      POSTGRES_DB: nexis
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexis -d nexis"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      <<: *restart-policy
      resources:
        limits:
          memory: 1G

  # ── Redis ─────────────────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: nexis-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ── Nginx reverse proxy ───────────────────────────────────────────────────────

  nginx:
    image: nginx:1.25-alpine
    container_name: nexis-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/letsencrypt:ro
      - nginx-cache:/var/cache/nginx
    networks:
      - frontend
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 10s
      retries: 2
    logging: *default-logging
    profiles:
      - production

  # ── Database admin (dev only) ─────────────────────────────────────────────────

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nexis-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nexis.dev
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:-pgadmin}"
      PGADMIN_LISTEN_PORT: "5050"
    ports:
      - "5050:5050"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - backend
    depends_on:
      - db
    profiles:
      - dev
      - tools
    logging: *default-logging

  # ── Mail catcher (dev only) ───────────────────────────────────────────────────

  mailhog:
    image: mailhog/mailhog:latest
    container_name: nexis-mail
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - backend
    profiles:
      - dev

  # ── Observability stack ───────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: nexis-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - backend
    profiles:
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: nexis-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-grafana}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - backend
    depends_on:
      - prometheus
    profiles:
      - observability

  # ── Migration runner ──────────────────────────────────────────────────────────

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: nexis-migrate
    command: ["./server", "migrate", "--up"]
    environment:
      <<: *env-common
      DATABASE_URL: postgresql://nexis:${DB_PASSWORD:-secret}@db:5432/nexis
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles:
      - tools
      - migration

# ── Volumes ───────────────────────────────────────────────────────────────────

volumes:
  app-data:
    driver: local
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${DATA_DIR:-./data}/postgres"
  redis-data:
    driver: local
  nginx-cache:
    driver: local
  pgadmin-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────

networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.1.0/24

# ── Secrets ───────────────────────────────────────────────────────────────────

secrets:
  jwt_secret:
    environment: JWT_SECRET
  db_password:
    environment: DB_PASSWORD
