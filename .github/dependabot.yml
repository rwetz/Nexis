version: 2
updates:
  # ── npm (frontend) ───────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Keep the many @codemirror/* and @lezer/* packages in one PR.
      codemirror:
        patterns:
          - "@codemirror/*"
          - "@lezer/*"
          - "cm6-graphql"
      # Tauri JS APIs together.
      tauri:
        patterns:
          - "@tauri-apps/*"
      # React and its types must move together: react and react-dom validate
      # that they are the *exact* same version at runtime and throw
      # "Incompatible React versions" otherwise. Ungrouped, dependabot opened
      # a react-without-react-dom PR (#17) that could never have gone green.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # AI SDK providers together.
      ai-sdk:
        patterns:
          - "@ai-sdk/*"
          - "ai"
      # Editor themes together.
      codemirror-themes:
        patterns:
          - "@uiw/*"

  # ── Cargo (Rust backend) ─────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10

  # ── GitHub Actions ───────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
