version: 2
# One grouped PR per ecosystem per week. Ungrouped, Dependabot opened ~25 PRs a
# week, each running the full CI matrix (and E2E on Windows), and a shared
# pre-existing failure turned every one of them red. One PR per ecosystem keeps
# coupled packages together (react + react-dom must match exactly; the many
# @codemirror/* and @ai-sdk/* packages move as a set) without a group per family.
# Security updates still arrive as their own PRs, outside this schedule.
updates:
  # ── npm (frontend) ───────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]

  # ── Cargo (Rust backend) ─────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      cargo:
        patterns: ["*"]

  # ── GitHub Actions ───────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
