name: E2E

# E2E tests require a full Tauri release build (~20 min on a cold runner) plus
# a running WebDriver server, so they are NOT wired to every push (that would
# tax every PR with a 20-min build). Instead they run nightly against main to
# catch integration regressions the unit/typecheck gates can't see, and can
# still be triggered manually from the Actions tab for an on-demand check.
on:
  # Nightly sweep against the default branch (06:17 UTC ≈ off-peak). The odd
  # minute avoids the top-of-hour congestion when GitHub defers scheduled jobs.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a full commit SHA (tag in trailing comment) — see ci.yml.
jobs:
  e2e:
    name: E2E tests (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # ── Node / pnpm ──────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.10.0"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # ── Rust ─────────────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # Share the same cache key as test-rust so incremental builds are fast
      # when both workflows run in the same repo.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "src-tauri -> target"

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build Nexis (release)
        run: pnpm tauri build

      # ── tauri-driver ─────────────────────────────────────────────────────────
      # tauri-driver wraps msedgedriver (pre-installed on windows-latest) and
      # acts as the WebDriver server that the WDIO test suite connects to.
      - name: Install tauri-driver
        run: cargo install tauri-driver

      # ── Diagnostics ──────────────────────────────────────────────────────────
      # `session not created: DevToolsActivePort file doesn't exist` has two
      # very different causes and the WebDriver error cannot tell them apart:
      # either msedgedriver could not talk to the webview, or the app process
      # died before it ever wrote the file. These steps split the two, and run
      # before the suite so their output survives a failing run.
      - name: Diagnose — component versions
        run: |
          $guid = "{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          foreach ($hive in @("HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$guid",
                              "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$guid")) {
            $pv = (Get-ItemProperty $hive -ErrorAction SilentlyContinue).pv
            if ($pv) { Write-Host "WebView2 Runtime: $pv  (from $hive)"; break }
          }
          $edge = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          if (Test-Path $edge) {
            Write-Host "Edge browser:    $((Get-Item $edge).VersionInfo.ProductVersion)"
          } else {
            Write-Host "Edge browser:    not found at the standard path"
          }

      # The decisive test. msedgedriver needs the app's WebView2 to come up with
      # remote debugging enabled; that is exactly what the missing
      # DevToolsActivePort file reports. Launching the release binary ourselves
      # with the same env var tauri-driver uses answers, in one step, whether
      # the app can expose that port at all — independently of WebDriver.
      - name: Diagnose — does the app expose a WebView2 debugging port?
        continue-on-error: true
        run: |
          $exe = "src-tauri\target\release\nexis.exe"
          if (-not (Test-Path $exe)) { Write-Host "BUILD MISSING: $exe"; exit 1 }
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9222"
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            Write-Host "RESULT: app EXITED EARLY with code $($p.ExitCode) — the failure is app-side, not the driver."
            exit 0
          }
          Write-Host "app is still running after 25s (pid $($p.Id))"
          try {
            $r = Invoke-WebRequest "http://127.0.0.1:9222/json/version" -UseBasicParsing -TimeoutSec 10
            Write-Host "RESULT: debugging port IS listening — the app is fine, suspect tauri-driver/msedgedriver."
            Write-Host $r.Content
          } catch {
            Write-Host "RESULT: app is alive but the debugging port is NOT listening — WebView2 is not honouring the remote-debugging argument."
            Write-Host "detail: $_"
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      # ── E2E ──────────────────────────────────────────────────────────────────
      - name: Run E2E tests
        run: pnpm test:e2e
