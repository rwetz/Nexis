name: E2E

# E2E tests require a full Tauri release build (~20 min on a cold runner) plus
# a running WebDriver server, so this does not run on every PR — only on the
# ones that could actually move it. The nightly sweep against main stays, to
# catch integration regressions the unit/typecheck gates can't see and to keep
# covering the drift the suite does not control (a WebView2 runtime roll, a
# newer release turning on UpdaterDialog).
on:
  # Nightly sweep against the default branch (06:17 UTC ≈ off-peak). The odd
  # minute avoids the top-of-hour congestion when GitHub defers scheduled jobs.
  schedule:
    - cron: "17 6 * * *"

  # PR gate, scoped by path. A docs-only or workflow-unrelated PR has no way to
  # break a running app, and making it wait ~20 min for a release build to say
  # so trains people to merge without reading the result. The Rust cache is
  # shared with ci.yml's test-rust job (same `workspaces` key), so a warm run
  # is a great deal faster than a cold one.
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "e2e/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - ".github/workflows/e2e.yml"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a full commit SHA (tag in trailing comment) — see ci.yml.
jobs:
  e2e:
    name: E2E tests (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # ── Node / pnpm ──────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.10.0"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # ── Rust ─────────────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # Share the same cache key as test-rust so incremental builds are fast
      # when both workflows run in the same repo.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "src-tauri -> target"

      # ── Build ─────────────────────────────────────────────────────────────────
      # The E2E overlay compiles --remote-debugging-port into the bundle. It has
      # to be a build-time config: wry sets AdditionalBrowserArguments
      # unconditionally, which supersedes the WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
      # env var tauri-driver would otherwise use. Never build a shipping
      # artifact with this overlay — release.yml deliberately does not.
      - name: Build Nexis (release, E2E overlay)
        run: pnpm tauri build --config src-tauri/tauri.e2e.conf.json

      # ── E2E ──────────────────────────────────────────────────────────────────
      - name: Run E2E tests
        run: pnpm test:e2e
