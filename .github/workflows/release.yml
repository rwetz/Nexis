name: Release

on:
  push:
    tags:
      - "v*"

# Only one release build at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Required so softprops/action-gh-release can create the release and upload assets.
permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build
        env:
          # Disable Tauri's built-in updater signing — not needed for plain
          # artifact uploads. Remove if you add a signing key later.
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Collect artifacts
        id: artifacts
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          $nsis   = "src-tauri/target/release/bundle/nsis/nexis_${version}_x64-setup.exe"
          $msi    = "src-tauri/target/release/bundle/msi/nexis_${version}_x64_en-US.msi"
          $binary = "src-tauri/target/release/nexis.exe"
          $found  = @()
          foreach ($f in $nsis, $msi, $binary) {
            if (Test-Path $f) { $found += $f }
          }
          echo "paths=$($found -join ',')" >> $env:GITHUB_OUTPUT
          echo "Found artifacts: $found"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Nexis ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
