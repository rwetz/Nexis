name: Release

on:
  push:
    tags:
      - "v*"

# Only one release build at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Required so softprops/action-gh-release can create the release and upload assets.
permissions:
  contents: write

# Actions are pinned to a full commit SHA (tag in trailing comment) — see ci.yml.
jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: "11.10.0"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build
        env:
          # Disable Tauri's built-in updater signing — not needed for plain
          # artifact uploads. Remove if you add a signing key later.
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # Bundle-size budget gate (IDEAS C1). "Under 10 MB" is a stated
      # non-negotiable; enforce it so a careless dependency can't quietly blow
      # the budget. Fails the release if the stripped binary exceeds 10 MiB.
      - name: Enforce binary size budget (< 10 MB)
        shell: pwsh
        run: |
          $binary = "src-tauri/target/release/nexis.exe"
          if (-not (Test-Path $binary)) {
            Write-Error "Release binary not found at $binary"
            exit 1
          }
          $bytes = (Get-Item $binary).Length
          $mib = [math]::Round($bytes / 1MB, 2)
          $maxBytes = 10 * 1024 * 1024
          Write-Host "nexis.exe = $bytes bytes ($mib MiB); budget = 10 MiB"
          if ($bytes -gt $maxBytes) {
            Write-Error "Binary exceeds the 10 MB budget (a stated non-negotiable). Investigate the dependency or build-config change that grew it."
            exit 1
          }
          Write-Host "OK: under the 10 MB budget."

      - name: Collect artifacts
        id: artifacts
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          $nsis   = "src-tauri/target/release/bundle/nsis/nexis_${version}_x64-setup.exe"
          $msi    = "src-tauri/target/release/bundle/msi/nexis_${version}_x64_en-US.msi"
          $binary = "src-tauri/target/release/nexis.exe"
          $found  = @()
          foreach ($f in $nsis, $msi, $binary) {
            if (Test-Path $f) { $found += $f }
          }
          echo "paths=$($found -join ',')" >> $env:GITHUB_OUTPUT
          echo "Found artifacts: $found"

      - name: Create GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          name: "Nexis ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-linux:
    name: Build Linux bundles (${{ matrix.arch }})
    # Build each Linux architecture natively on its own runner — no cross-
    # compilation, so the webkit2gtk/rsvg/appindicator system stack resolves
    # per-arch straight from apt (cross-compiling that stack is the painful
    # part and buys nothing here). Each leg uses the oldest supported runner
    # for its arch so the AppImage's glibc/webkit baseline is as broad as
    # possible — it still runs on newer distros (including Arch-based
    # CachyOS) but not vice-versa. fail-fast is off so a flaky leg (e.g. a
    # transient apt failure) can't abort a healthy one mid-release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: "11.10.0"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"

      # Same webkit/appindicator/rsvg stack as ci.yml's test-rust-linux (proven
      # green on this runner), plus patchelf + file for AppImage bundling and the
      # *runtime* gstreamer plugins that `appimage.bundleMediaFramework: true`
      # bundles into the AppImage.
      #
      # Do NOT add the gstreamer `-dev` packages: on the ubuntu-22.04 runner
      # `libgstreamer1.0-dev` pulls an unsatisfiable `libunwind-dev`, which makes
      # apt bail out with "held broken packages" and fails the whole step. We
      # don't compile against gstreamer headers, so the runtime plugin packages
      # are all the media-framework bundler needs.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build
        env:
          # Match the Windows job: no updater signing for plain artifact uploads.
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # AppImage is the portable "download and run" artifact (works on Arch,
      # Fedora, Debian, etc.); deb/rpm are provided for native package managers.
      # No 10 MB size gate here — that budget is about the Windows exe; a Linux
      # AppImage bundles webkit2gtk and is expected to be much larger.
      - name: Create GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          name: "Nexis ${{ github.ref_name }}"
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
