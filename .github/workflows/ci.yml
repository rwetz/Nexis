name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run for the same ref so stacked pushes don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA (with the human-readable
# tag in a trailing comment) rather than a moving tag. A tag can be re-pointed
# at malicious code after review; a SHA cannot. Bump these deliberately.
jobs:
  # ── TypeScript / Vitest ───────────────────────────────────────────────────
  test-frontend:
    name: TypeScript tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: "11.10.0"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck before tests: a type error that doesn't happen to break a
      # Vitest case would otherwise pass CI green. `tsc --noEmit` is the gate.
      - name: Typecheck (tsc --noEmit)
        run: pnpm exec tsc --noEmit

      # Run the suite with coverage so the thresholds in vitest.config.ts gate
      # CI — a drop below the configured floor fails the build (IDEAS D4).
      - name: Run Vitest with coverage
        run: pnpm test:coverage

      # Supply-chain gate: fail only on high/critical advisories in the
      # *runtime* dependency tree. `--prod` excludes dev tooling (shadcn, the
      # MCP SDK, etc.); moderate advisories are tracked by the weekly audit job
      # rather than blocking every push.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # ── Rust / cargo test ─────────────────────────────────────────────────────
  # Run on Windows so Windows-specific tests (ConPTY lifecycle, workspace
  # auth, PowerShell launch spec) are exercised. GitHub's Windows runners have
  # SeCreateSymbolicLinkPrivilege, so the symlink-escape test passes there even
  # though it requires admin on a typical dev machine.
  test-rust:
    name: Rust tests (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # Cache target/ keyed on Cargo.lock so incremental rebuilds are fast.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

  # ── Rust / clippy + fmt ───────────────────────────────────────────────────
  # Run on Windows so Windows-specific code paths (#[cfg(target_os = "windows")])
  # are linted. rustfmt is platform-independent but co-locating keeps the job
  # count low.
  lint-rust:
    name: Rust lint (clippy + fmt)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Rust stable (with clippy + rustfmt)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

  # ── Rust / cargo test (Linux) ─────────────────────────────────────────────
  # Runs the cross-platform subset: authorize_spawn_cwd, git UTF-8 handling,
  # mutex poison recovery, build_globset, shell sentinel logic, and the Unix
  # write_if_changed tests in shell_init.rs.
  test-rust-linux:
    name: Rust tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "src-tauri -> target"

      # Tauri's native crates link against webkit2gtk and friends even for
      # `cargo test`, so the system libraries must be present.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

  # ── Rust / cargo test (macOS) ─────────────────────────────────────────────
  # macOS uses the apple-native keychain backend and its own window-controls
  # path — this is the only job that compiles and exercises them. Unix symlink
  # creation needs no special privilege, so the symlink-escape test passes here
  # too (unlike a non-admin Windows dev machine).
  test-rust-macos:
    name: Rust tests (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test
